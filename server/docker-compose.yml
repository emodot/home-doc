services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: homedoc
      POSTGRES_PASSWORD: homedoc
      POSTGRES_DB: homedoc
    ports:
      - "5432:5432"
    volumes:
      - homedoc_postgres_data:/var/lib/postgresql/data

volumes:
  homedoc_postgres_data:
