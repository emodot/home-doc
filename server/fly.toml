app = "home-doc-api"
primary_region = "iad"

[build]

[env]
  PORT = "4000"
  NODE_ENV = "production"

[deploy]
  release_command = "npx prisma migrate deploy"

[http_service]
  internal_port        = 4000
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1
